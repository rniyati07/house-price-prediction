[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "house-price"
version = "0.1.0"
requires-python = ">=3.11"

[project.scripts]
house-price = "house_price.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
markers = [
    "data: needs the real dataset at data/raw/train.csv (skipped when it is absent)",
]

[tool.ruff]
line-length = 100

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "house_price.*"
disallow_untyped_defs = true

[tool.coverage.run]
source = ["house_price"]  # the package only (DOC-05 M10: coverage threshold)
omit = ["*/__main__.py"]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = true
