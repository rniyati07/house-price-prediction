# Candidate definitions (DOC-03 §5.1, §8). Loaded into house_price.config.ModelsConfig.
#
# M6 defines the two baselines (DOC-03 §8.2, §8.3). They set the floor every candidate
# must beat (ADR-10) and are never eligible for selection or deployment. M7 adds the four
# candidates with their fixed settings and reference configurations, and the ablation
# references. M8 adds the search spaces, budgets, and the blend.
#
# CANONICAL VALUES. The grids (25 points), trial budgets (Random Forest 30, LightGBM 100)
# and search spaces below are the DOC-03 §10 / DN-06 values. Together with validation.yaml
# (5 folds x 3 repeats) they are the full M8 configuration. Reduced development or smoke
# runs use a separate copy of the configs directory (house-price train --config-dir ...
# --root <isolated project>), never an edit of these files.
#
# The global seed (validation.yaml, DN-02) is passed to every seeded estimator as
# random_state by the registry; it is not repeated here.

baselines:
  # The "no model" floor: predicts the fitting data's median log price for every house.
  # It uses the full pipeline (DOC-03 §7.1); the branch only affects preprocessing, which
  # a DummyRegressor ignores.
  dummy_median:
    branch: tree
    strategy: median

  # The "rule of thumb" floor: LinearRegression on the two documented dominant drivers
  # (DOC-02 §2.2), passed through unscaled, inside the log-target wrapper.
  linear_2feat:
    features: ["OverallQual", "GrLivArea"]

# The four candidates (DOC-03 §8.1). Tiers: DN-08 (Ridge and Lasso share the linear tier).
candidates:
  # DOC-03 §8.4, §10.3. The reference alpha is not fixed here: the M7 ablation chooses it
  # with this grid on the full linear feature set (DOC-03 §6.6 step 2).
  ridge:
    branch: linear
    tier: 1
    tuning: grid
    grid: {param: alpha, low: 1.0e-3, high: 1.0e+3, n: 25}

  # DOC-03 §8.5, §10.4. The reference alpha 1e-3 is the geometric midpoint of the grid,
  # used for the M7 development check only (approved project decision; M8 tunes it).
  lasso:
    branch: linear
    tier: 1
    tuning: grid
    grid: {param: alpha, low: 1.0e-5, high: 1.0e-1, n: 25}
    fixed: {max_iter: 50000}
    reference: {alpha: 1.0e-3}

  # DOC-03 §8.6, §10.5 fixed settings; every other parameter is the scikit-learn default
  # (approved project decision). The full effective configuration is logged to MLflow.
  random_forest:
    branch: tree
    tier: 2
    tuning: optuna
    fixed: {n_jobs: -1, bootstrap: true}
    # DOC-03 §10.5: Optuna TPE (seed from validation.yaml), 30 trials.
    n_trials: 30
    search_space:
      n_estimators: {type: int, low: 100, high: 600}
      max_depth: {type: int, low: 6, high: 30}
      min_samples_split: {type: int, low: 2, high: 20}
      min_samples_leaf: {type: int, low: 1, high: 10}
      max_features: {type: float, low: 0.2, high: 1.0}

  # DOC-03 §8.7; determinism settings DN-14 (§10.6); reference parameters DOC-03 §6.6.
  lightgbm:
    branch: tree
    tier: 3
    tuning: optuna
    fixed: {deterministic: true, force_row_wise: true, n_jobs: 1, verbose: -1}
    # DOC-03 §10.6 (ADR-13): Optuna TPE (seed from validation.yaml), exactly 100 trials.
    # subsample_freq stays 1 (from reference) so that bagging is active.
    n_trials: 100
    search_space:
      learning_rate: {type: float, low: 0.01, high: 0.2, log: true}
      num_leaves: {type: int, low: 8, high: 64}
      min_child_samples: {type: int, low: 5, high: 50}
      n_estimators: {type: int, low: 200, high: 2000}
      subsample: {type: float, low: 0.5, high: 1.0}
      colsample_bytree: {type: float, low: 0.3, high: 1.0}
      reg_alpha: {type: float, low: 1.0e-8, high: 10.0, log: true}
      reg_lambda: {type: float, low: 1.0e-8, high: 10.0, log: true}
    reference:
      learning_rate: 0.05
      n_estimators: 600
      num_leaves: 15
      min_child_samples: 20
      subsample: 0.8
      subsample_freq: 1
      colsample_bytree: 0.7
      reg_alpha: 0.0
      reg_lambda: 0.0

# Feature-ablation reference model per branch (DOC-03 §6.6, DN-05).
ablation:
  linear: ridge
  tree: lightgbm

# The DN-07 blend (DOC-03 §8.8): equal weights (0.5/0.5, fixed in code), averaged in log
# space; the linear component is whichever of these has the lower tuned mean CV log-RMSE.
blend:
  tier: 4
  linear: [ridge, lasso]
  tree: lightgbm
