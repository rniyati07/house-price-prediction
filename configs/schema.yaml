# Data contract (DOC-03 §5.3, FR-004, FR-005). Loaded into house_price.config.SchemaConfig.
#
# Single source for the Pandera ingestion schema (M2) and for the model-input / API request
# schema (M5, M11). One entry per raw column, in raw-file order.
#
#   name            canonical column name used by the code base
#   source_name     exact header in data/raw/train.csv (renamed to `name` on load)
#   dtype           int | float | category | string   (numeric columns with missing values are float)
#   nullable        true only for columns that contain missing values in the raw file
#   role            model_input | excluded | identifier | target
#   allowed_values  data-dictionary codes plus the file's own spellings where they differ
#   min / max       inclusive range; strict_min: true makes the lower bound exclusive
#   unique          values must be unique (identifiers)
#
# Range classes (DOC-03 §5.3): areas >= 0 with ceiling 20,000 (GrLivArea > 0); lot size > 0;
# counts 0-20; ratings 1-10; construction years 1800-2010; remodel year 1950-2010;
# MoSold 1-12; YrSold 2006-2010; money >= 0; SalePrice > 0.

columns:
  - name: "Id"
    source_name: "Order"
    dtype: int
    nullable: false
    role: identifier
    unique: true
    min: 1
    note: "Row number of the source file; renamed to Id, the primary identifier."

  - name: "PID"
    source_name: "PID"
    dtype: string
    nullable: false
    role: identifier
    unique: true
    pattern: "^[0-9]{10}$"
    note: "Assessor parcel number, kept as text so the leading zero is preserved."

  - name: "MSSubClass"
    source_name: "MS SubClass"
    dtype: int
    nullable: false
    role: model_input
    allowed_values: [20, 30, 40, 45, 50, 60, 70, 75, 80, 85, 90, 120, 150, 160, 180, 190]
    min: 20
    max: 190
    note: "Dwelling-class code, stored zero-padded in the file (e.g. 020); a code, not a quantity."

  - name: "MSZoning"
    source_name: "MS Zoning"
    dtype: category
    nullable: false
    role: model_input
    allowed_values: ["A", "C", "FV", "I", "RH", "RL", "RP", "RM", "A (agr)", "C (all)", "I (all)"]
    note: "Includes the file's spellings that differ from the data dictionary: \"A (agr)\", \"C (all)\", \"I (all)\"."

  - name: "LotFrontage"
    source_name: "Lot Frontage"
    dtype: float
    nullable: true
    role: model_input
    min: 0
    max: 1000
    strict_min: true

  - name: "LotArea"
    source_name: "Lot Area"
    dtype: int
    nullable: false
    role: model_input
    min: 0
    max: 500000
    strict_min: true

  - name: "Street"
    source_name: "Street"
    dtype: category
    nullable: false
    role: model_input
    allowed_values: ["Grvl", "Pave"]

  - name: "Alley"
    source_name: "Alley"
